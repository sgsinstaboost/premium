<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SGS ONLINE SERVICE - Government & College Online Seva Portal</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html, body {
      overscroll-behavior-y: contain;
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    #splash-screen {
      transition: opacity 0.4s ease-out;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-yellow-200">
  
  <div id="splash-screen" class="fixed inset-0 z-[100] bg-gradient-to-br from-blue-900 via-indigo-900 to-slate-950 flex flex-col items-center justify-center p-4 text-white">
    <div class="flex flex-col items-center text-center max-w-sm">
      <div class="w-16 h-16 bg-yellow-400 text-slate-950 rounded-2xl flex items-center justify-center text-2xl font-black shadow-lg mb-4 animate-pulse">
        SGS
      </div>
      <h1 class="text-xl sm:text-2xl font-black text-yellow-300 tracking-tight leading-tight">
        SGS ONLINE SERVICE
      </h1>
      <p class="text-[11px] font-bold text-amber-200/90 uppercase tracking-widest mt-1">
        Government & College Online Seva Portal
      </p>

      <div class="mt-8 flex flex-col items-center gap-2">
        <div class="w-8 h-8 border-3 border-yellow-400 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-[11px] text-slate-300 font-semibold tracking-wide">Loading Seva Portal...</p>
      </div>
    </div>
  </div>

  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword,
      sendPasswordResetEmail,
      signInWithPopup,
      GoogleAuthProvider,
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getDatabase, 
      ref, 
      onValue, 
      set, 
      push, 
      remove, 
      get, 
      update 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

    // Clean Raw Config Object
    const rawConfigObj = {
      apiKey: "AIzaSyDnYNpfLEsGOhTMT1dkDReH4fRA0pgOs94".trim(),
      authDomain: "sgs-online-service.firebaseapp.com".trim(),
      databaseURL: "https://sgs-online-service-default-rtdb.firebaseio.com".trim(),
      projectId: "sgs-online-service".trim(),
      storageBucket: "sgs-online-service.firebasestorage.app".trim(),
      messagingSenderId: "12707331594".trim(),
      appId: "1:12707331594:web:9f5645f5744b7fc7af29f3".trim()
    };

    const encodedConfig = btoa(JSON.stringify(rawConfigObj));
    const firebaseConfig = JSON.parse(atob(encodedConfig));

    // Admin UID (a7XKd7o4aGNqgGiIO9GRe5Q1Rhn1)
    window.ENCODED_ADMIN_UID = btoa("a7XKd7o4aGNqgGiIO9GRe5Q1Rhn1");

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    window.firebaseAuth = getAuth(app);
    window.googleProvider = new GoogleAuthProvider();
    window.firebaseDb = getDatabase(app);
    window.firebaseRef = ref;
    window.firebaseOnValue = onValue;
    window.firebaseSet = set;
    window.firebasePush = push;
    window.firebaseRemove = remove;
    window.firebaseGet = get;
    window.firebaseUpdate = update;
    window.firebaseSignIn = signInWithEmailAndPassword;
    window.firebaseSignUp = createUserWithEmailAndPassword;
    window.firebaseResetPassword = sendPasswordResetEmail;
    window.firebaseGooglePopup = () => signInWithPopup(window.firebaseAuth, window.googleProvider);
    window.firebaseSignOut = signOut;
    window.firebaseOnAuth = onAuthStateChanged;

    window.dispatchEvent(new Event('firebase-ready'));

    // Fast 1.2 second Loader dismiss on every page load/refresh
    setTimeout(() => {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 400);
      }
    }, 1200);
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // SVG Icons
    const Icons = {
      Search: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>,
      Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>,
      Trash2: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>,
      Edit3: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>,
      ArrowLeft: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>,
      ExternalLink: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>,
      CheckCircle2: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
      FileText: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>,
      Lock: () => <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>,
      X: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>,
      ChevronRight: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"/></svg>,
      Bell: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>,
      Menu: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"/></svg>,
      ShieldCheck: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>,
      User: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>,
      Clock: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
      Share2: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>,
      Google: () => <svg className="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
    };

    // Clean initial arrays
    const SEED_NOTICES = [];
    const SEED_SERVICES = [];
    const SEED_CATEGORIES = [
      'Sabhi Services',
      'College Admission',
      'Scholarship',
      'Certificates (Jati/Aaya/Niwas)',
      'Admit Card & Result'
    ];

    function App() {
      const [services, setServices] = useState(SEED_SERVICES);
      const [notices, setNotices] = useState(SEED_NOTICES);
      const [categories, setCategories] = useState(SEED_CATEGORIES);
      const [applications, setApplications] = useState([]);
      const [allUsersList, setAllUsersList] = useState([]);

      const [selectedCat, setSelectedCat] = useState('Sabhi Services');
      const [searchQuery, setSearchQuery] = useState('');
      const [activeService, setActiveService] = useState(null); 
      const [iframeUrl, setIframeUrl] = useState(null); 

      // Drawer & Modal Views
      const [showDrawer, setShowDrawer] = useState(false);
      const [activeModalPage, setActiveModalPage] = useState(null);

      // User Auth State
      const [currentUser, setCurrentUser] = useState(null);
      const [customUserId, setCustomUserId] = useState('');

      // Admin Auth State
      const [isAdmin, setIsAdmin] = useState(false);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [adminEmail, setAdminEmail] = useState('');
      const [adminPassword, setAdminPassword] = useState('');
      const [authError, setAuthError] = useState('');
      const [isAuthLoading, setIsAuthLoading] = useState(false);

      // Admin Selected User Inspector State
      const [selectedInspectorUid, setSelectedInspectorUid] = useState(null);

      // Service Form Modal State
      const [showServiceFormModal, setShowServiceFormModal] = useState(false);
      const [editingServiceId, setEditingServiceId] = useState(null);
      
      const [formCategory, setFormCategory] = useState('');
      const [formTitle, setFormTitle] = useState('');
      const [formShortDesc, setFormShortDesc] = useState('');
      const [formDescType, setFormDescType] = useState('normal'); 
      const [formDescription, setFormDescription] = useState('');
      const [formDocs, setFormDocs] = useState('');
      const [formApplyLink, setFormApplyLink] = useState('');
      const [formBannerUrl, setFormBannerUrl] = useState('');

      // Notice & Category Modals State
      const [showNoticeModal, setShowNoticeModal] = useState(false);
      const [editingNoticeId, setEditingNoticeId] = useState(null);
      const [noticeText, setNoticeText] = useState('');

      const [showCategoryModal, setShowCategoryModal] = useState(false);
      const [newCatName, setNewCatName] = useState('');

      // Toast Notification State
      const [toastMsg, setToastMsg] = useState('');

      const showNotification = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      // Restore active form filling session if browser reloaded/minimized
      useEffect(() => {
        try {
          const savedIframe = sessionStorage.getItem('sgs_active_iframe');
          const savedService = sessionStorage.getItem('sgs_active_service');
          if (savedIframe && savedService) {
            setIframeUrl(savedIframe);
            setActiveService(JSON.parse(savedService));
          }
        } catch (e) {
          console.error("Session restore error:", e);
        }
      }, []);

      // Refresh / Unload Lock Warning while form filling
      useEffect(() => {
        if (iframeUrl) {
          const handleBeforeUnload = (e) => {
            e.preventDefault();
            e.returnValue = 'Aapka form chal raha hai. Kya aap sach me website chorna chahte hain?';
            return e.returnValue;
          };
          window.addEventListener('beforeunload', handleBeforeUnload);
          return () => window.removeEventListener('beforeunload', handleBeforeUnload);
        }
      }, [iframeUrl]);

      useEffect(() => {
        const setupFirebaseSync = () => {
          if (!window.firebaseDb) return;

          // Sync Services
          const servicesRef = window.firebaseRef(window.firebaseDb, 'services');
          window.firebaseOnValue(servicesRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
              const list = Object.keys(data).map(key => ({ id: key, ...data[key] }));
              setServices(list);
            } else {
              setServices([]);
            }
          });

          // Sync Notices
          const noticesRef = window.firebaseRef(window.firebaseDb, 'notices');
          window.firebaseOnValue(noticesRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
              const list = Object.keys(data).map(key => ({ id: key, ...data[key] }));
              setNotices(list);
            } else {
              setNotices([]);
            }
          });

          // Sync Categories
          const categoriesRef = window.firebaseRef(window.firebaseDb, 'categories');
          window.firebaseOnValue(categoriesRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
              if (Array.isArray(data)) {
                setCategories(data);
              } else {
                setCategories(Object.values(data));
              }
            } else {
              window.firebaseSet(categoriesRef, SEED_CATEGORIES);
            }
          });

          // Sync Applications
          const applicationsRef = window.firebaseRef(window.firebaseDb, 'applications');
          window.firebaseOnValue(applicationsRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
              const list = Object.keys(data).map(key => ({ id: key, ...data[key] }));
              setApplications(list);
            } else {
              setApplications([]);
            }
          });

          // Sync All Users
          const usersRef = window.firebaseRef(window.firebaseDb, 'users');
          window.firebaseOnValue(usersRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
              const list = Object.keys(data).map(key => ({ uid: key, ...data[key] }));
              setAllUsersList(list);
            } else {
              setAllUsersList([]);
            }
          });

          // Auth State Listener & Custom User ID
          window.firebaseOnAuth(window.firebaseAuth, async (user) => {
            if (user) {
              setCurrentUser(user);
              const adminUid = atob(window.ENCODED_ADMIN_UID);
              setIsAdmin(user.uid === adminUid);

              try {
                const userRef = window.firebaseRef(window.firebaseDb, 'users/' + user.uid);
                const snapshot = await window.firebaseGet(userRef);
                let cid = '';
                if (snapshot.exists() && snapshot.val() && snapshot.val().customId) {
                  cid = snapshot.val().customId;
                } else {
                  const randNum = Math.floor(100000 + Math.random() * 900000);
                  cid = 'SGS-' + randNum;
                  await window.firebaseSet(userRef, {
                    uid: user.uid,
                    email: user.email || 'Anonymous User',
                    customId: cid,
                    createdAt: new Date().toISOString()
                  });
                }
                setCustomUserId(cid);
              } catch (err) {
                console.error("Custom User ID generation error:", err);
                const fallbackId = 'SGS-' + Math.floor(100000 + Math.random() * 900000);
                setCustomUserId(fallbackId);
              }

            } else {
              setCurrentUser(null);
              setIsAdmin(false);
              setCustomUserId('');
            }
          });
        };

        if (window.firebaseDb) {
          setupFirebaseSync();
        } else {
          window.addEventListener('firebase-ready', setupFirebaseSync);
        }
      }, []);

      useEffect(() => {
        const handlePopState = () => {
          if (iframeUrl) {
            setIframeUrl(null);
            sessionStorage.removeItem('sgs_active_iframe');
            sessionStorage.removeItem('sgs_active_service');
          } else if (activeService) {
            setActiveService(null);
          } else if (activeModalPage) {
            setActiveModalPage(null);
          } else if (showDrawer) {
            setShowDrawer(false);
          } else if (showLoginModal) {
            setShowLoginModal(false);
          }
        };
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, [iframeUrl, activeService, activeModalPage, showDrawer, showLoginModal]);

      const openServiceDetail = (srv) => {
        window.history.pushState({ view: 'detail' }, '');
        setActiveService(srv);
      };

      // Direct open embedded form & record in Realtime Database
      const openEmbeddedForm = async (srv) => {
        if (srv && srv.applyLink) {
          await recordApplication(srv);
          window.open(srv.applyLink, '_blank', 'noopener,noreferrer');
        } else {
          showNotification('Apply link uplabdh nahi hai!');
        }
      };

      const recordApplication = async (srv) => {
        if (!srv) return;
        const now = Date.now();
        const appId = 'app-' + now;

        const applicationData = {
          id: appId,
          uid: currentUser ? currentUser.uid : 'guest_user',
          userEmail: currentUser ? (currentUser.email || 'Anonymous User') : 'Public Applicant',
          customId: customUserId || 'SGS-PUBLIC',
          serviceId: srv.id || 'N/A',
          serviceTitle: srv.title || 'Untitled Form',
          category: srv.category || 'General',
          applyTimestamp: now,
          applyDate: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
          status: 'Pending'
        };

        try {
          const appRef = window.firebaseRef(window.firebaseDb, 'applications/' + appId);
          await window.firebaseSet(appRef, applicationData);
          showNotification('Form Apply Record Saved to Realtime DB!');
        } catch (e) {
          console.error("Database Record Error:", e);
        }
      };

      const handleBackToServices = () => {
        if (window.history.state?.view) {
          window.history.back();
        } else {
          setActiveService(null);
        }
      };

      const handleBackFromIframe = () => {
        sessionStorage.removeItem('sgs_active_iframe');
        sessionStorage.removeItem('sgs_active_service');
        if (window.history.state?.view) {
          window.history.back();
        } else {
          setIframeUrl(null);
        }
      };

      const handleShareWebsite = () => {
        const shareData = {
          title: 'SGS ONLINE SERVICE',
          text: 'SGS ONLINE SERVICE - Government & College Online Form Seva Portal',
          url: window.location.href
        };

        if (navigator.share) {
          navigator.share(shareData).catch(() => {});
        } else {
          const tempInput = document.createElement('input');
          tempInput.value = window.location.href;
          document.body.appendChild(tempInput);
          tempInput.select();
          document.execCommand('copy');
          document.body.removeChild(tempInput);
          showNotification('Website link copy ho gaya hai!');
        }
        setShowDrawer(false);
      };

      const handleAdminEmailLogin = async (e) => {
        e.preventDefault();
        setAuthError('');
        setIsAuthLoading(true);

        try {
          const userCredential = await window.firebaseSignIn(window.firebaseAuth, adminEmail, adminPassword);
          const user = userCredential.user;
          const targetUid = atob(window.ENCODED_ADMIN_UID);

          if (user.uid === targetUid) {
            setIsAdmin(true);
            setShowLoginModal(false);
            setAdminEmail('');
            setAdminPassword('');
            showNotification('Admin Login Successful!');
          } else {
            setAuthError('Error: Unauthorized Admin Account UID mismatch!');
            await window.firebaseSignOut(window.firebaseAuth);
            setIsAdmin(false);
          }
        } catch (err) {
          setAuthError('Login Failed: ' + err.message);
        } finally {
          setIsAuthLoading(false);
        }
      };

      const handleAdminLogout = async () => {
        await window.firebaseSignOut(window.firebaseAuth);
        setIsAdmin(false);
        showNotification('Admin Logged Out');
      };

      const openServiceModal = (service = null, e = null) => {
        if (e) e.stopPropagation();

        const validCategories = categories.filter(c => c !== 'Sabhi Services');
        const defaultCat = validCategories[0] || 'College Admission';

        if (service) {
          setEditingServiceId(service.id);
          setFormCategory(service.category || defaultCat);
          setFormTitle(service.title || '');
          setFormShortDesc(service.shortDesc || '');
          setFormDescType(service.descType || 'normal');
          setFormDescription(service.description || '');
          setFormDocs(Array.isArray(service.requiredDocs) ? service.requiredDocs.join('\n') : '');
          setFormApplyLink(service.applyLink || '');
          setFormBannerUrl(service.bannerUrl || '');
        } else {
          setEditingServiceId(null);
          setFormCategory(defaultCat);
          setFormTitle('');
          setFormShortDesc('');
          setFormDescType('normal');
          setFormDescription('');
          setFormDocs('');
          setFormApplyLink('');
          setFormBannerUrl('');
        }
        setShowServiceFormModal(true);
      };

      const handleSaveService = (e) => {
        e.preventDefault();
        if (!formTitle.trim() || !formApplyLink.trim()) {
          showNotification('Title aur Apply Link bharna zaruri hai!');
          return;
        }

        const docsArray = formDocs.split('\n').filter(d => d.trim() !== '');

        const serviceData = {
          category: formCategory,
          title: formTitle,
          shortDesc: formShortDesc,
          descType: formDescType,
          description: formDescription,
          requiredDocs: docsArray,
          applyLink: formApplyLink,
          bannerUrl: formBannerUrl
        };

        if (editingServiceId) {
          const srvRef = window.firebaseRef(window.firebaseDb, 'services/' + editingServiceId);
          window.firebaseSet(srvRef, { id: editingServiceId, ...serviceData });
          showNotification('Service Updated Realtime!');
          
          if (activeService?.id === editingServiceId) {
            setActiveService({ id: editingServiceId, ...serviceData });
          }
        } else {
          const newId = 's-' + Date.now();
          const srvRef = window.firebaseRef(window.firebaseDb, 'services/' + newId);
          window.firebaseSet(srvRef, { id: newId, ...serviceData });
          showNotification('New Service Added Realtime!');
        }

        setShowServiceFormModal(false);
      };

      const handleDeleteService = (id, e = null) => {
        if (e) e.stopPropagation();
        if (window.confirm('Kya aap is service ko Realtime Database se delete karna chahte hain?')) {
          const srvRef = window.firebaseRef(window.firebaseDb, 'services/' + id);
          window.firebaseRemove(srvRef);
          if (activeService?.id === id) setActiveService(null);
          showNotification('Service Deleted!');
        }
      };

      const openNoticeModal = (notice = null) => {
        if (notice) {
          setEditingNoticeId(notice.id);
          setNoticeText(notice.text || '');
        } else {
          setEditingNoticeId(null);
          setNoticeText('');
        }
        setShowNoticeModal(true);
      };

      const handleSaveNotice = (e) => {
        e.preventDefault();
        if (!noticeText.trim()) return;

        if (editingNoticeId) {
          const noticeRef = window.firebaseRef(window.firebaseDb, 'notices/' + editingNoticeId);
          window.firebaseUpdate(noticeRef, {
            text: noticeText,
            date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
          });
          showNotification('Notice Updated Realtime!');
        } else {
          const newId = 'n-' + Date.now();
          const noticeData = {
            id: newId,
            text: noticeText,
            date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
          };
          const noticeRef = window.firebaseRef(window.firebaseDb, 'notices/' + newId);
          window.firebaseSet(noticeRef, noticeData);
          showNotification('Notice Published Realtime!');

        setEditingNoticeId(null);
        setShowNoticeModal(false);

      const handleDeleteNotice = (id) => {
        if (window.confirm('Is notice ko Realtime Database se delete karein?')) {
          const noticeRef = window.firebaseRef(window.firebaseDb, 'notices/' + id);
          window.firebaseRemove(noticeRef);
          showNotification('Notice Removed!');

        e.preventDefault();

        if (appItem.status === 'Pending' && (now - appItem.applyTimestamp > fiveMinsMs)) {

        return appItem.status || 'Pending';

                <button
                  onClick={() => recordApplication(activeService)}
                  className="inline-flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold px-3 py-1.5 rounded-lg shadow-md animate-pulse border border-emerald-400"
                >
                  ✅ Google Form Submit Ho Gaya? Status Track Karein ⚡
                </button>

                <a
                  href={iframeUrl}
                  target="_blank"
                  rel="noreferrer"
                  className="text-xs text-slate-300 hover:text-white flex items-center gap-1 bg-slate-700 px-2.5 py-1 rounded"
                >
                  <Icons.ExternalLink /> Direct Tab
                </a>
              </div>
              <div className="flex-1 w-full bg-white relative min-h-[750px]">
                <iframe 
                  src={iframeUrl}
                  className="w-full h-full min-h-[750px] border-0"
                  title="Online Form Application"
                >
                  Loading Form...
                </iframe>
              </div>
            </main>
          ) : 

          activeService ? (
            <main className="flex-1 max-w-4xl w-full mx-auto px-4 py-6">
              <button
                onClick={handleBackToServices}
                className="inline-flex items-center gap-2 bg-white hover:bg-slate-200 text-slate-800 font-bold text-xs sm:text-sm px-4 py-2 rounded-xl border border-slate-300 shadow-2xs mb-6 transition-all"
              >
                <Icons.ArrowLeft /> Sabhi Services Par Wapas Jayein
              </button>

              <div className="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
                {activeService.bannerUrl ? (
                  <div className="w-full h-48 sm:h-64 overflow-hidden bg-slate-900 relative">
                    <img src={activeService.bannerUrl} alt={activeService.title} className="w-full h-full object-cover" />
                    <div className="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/40 to-transparent p-6 flex flex-col justify-end">
                      <span className="bg-blue-600 text-white text-[11px] font-bold px-2.5 py-1 rounded uppercase tracking-wider w-fit">
                        {activeService.category}
                      </span>
                      <h2 className="text-2xl sm:text-3xl font-extrabold text-white mt-2 leading-snug drop-shadow-md">
                        {activeService.title}
                      </h2>
                    </div>
                  </div>
                ) : (
                  <div className="bg-slate-900 text-white p-6 sm:p-8">
                    <span className="bg-blue-600 text-white text-[11px] font-bold px-2.5 py-1 rounded uppercase tracking-wider">
                      {activeService.category}
                    </span>
                    <h2 className="text-2xl sm:text-3xl font-extrabold text-white mt-3 leading-snug">
                      {activeService.title}
                    </h2>
                  </div>
                )}

                <div className="p-6 sm:p-8 space-y-6">
                  {activeService.requiredDocs && activeService.requiredDocs.length > 0 && (
                    <div className="bg-slate-50 border border-slate-200 rounded-xl p-5">
                      <h3 className="text-base font-bold text-slate-900 flex items-center gap-2 mb-3">
                        <Icons.FileText />
                        <span>Kya-Kya Dastavez (Documents) Lagega:</span>
                      </h3>
                      <ul className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        {activeService.requiredDocs.map((doc, idx) => (
                          <li key={idx} className="flex items-start gap-2 text-xs sm:text-sm text-slate-700 bg-white p-2.5 rounded border border-slate-200">
                            <span className="text-emerald-600"><Icons.CheckCircle2 /></span>
                            <span>{doc}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}

                  <div>
                    <h3 className="text-base font-bold text-slate-900 mb-2 border-b border-slate-200 pb-2">
                      Poori Jaankari / Description:
                    </h3>
                    {activeService.descType === 'html' ? (
                      <div 
                        className="text-sm text-slate-700 leading-relaxed font-sans"
                        dangerouslySetInnerHTML={{ __html: activeService.description }}
                      />
                    ) : (
                      <div className="whitespace-pre-line text-sm text-slate-700 leading-relaxed bg-slate-50/50 p-4 rounded-lg border border-slate-200">
                        {activeService.description || "Apply Button par click karke form bharein."}
                      </div>
                    )}
                  </div>

                  <div className="pt-6 border-t border-slate-200 text-center">
                    <button
                      onClick={() => openEmbeddedForm(activeService)}
                      className="w-full sm:w-auto min-w-[260px] bg-blue-700 hover:bg-blue-800 text-white font-extrabold text-lg px-8 py-3.5 rounded-xl shadow-lg transition-all"
                    >
                      ONLINE APPLY KAREIN
                    </button>
                  </div>
                </div>
              </div>
            </main>
          ) : 

          (
            <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-6 space-y-6">
              
              {selectedCat !== 'Sabhi Services' ? (
                <div className="bg-gradient-to-r from-blue-900 to-indigo-900 text-white rounded-xl p-5 shadow-md flex items-center justify-between gap-3">
                  <div>
                    <span className="text-[10px] bg-amber-400 text-slate-900 font-extrabold px-2 py-0.5 rounded uppercase">
                      Focused Category View
                    </span>
                    <h2 className="text-xl sm:text-2xl font-black text-white mt-1">
                      📂 {selectedCat}
                    </h2>
                    <p className="text-xs text-blue-200 mt-0.5">
                      Is section me kul {filteredServices.length} active service buttons hain.
                    </p>
                  </div>

                  <button
                    onClick={() => { setSelectedCat('Sabhi Services'); setSearchQuery(''); }}
                    className="bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-extrabold text-xs px-4 py-2 rounded-lg shadow transition-colors shrink-0 flex items-center gap-1"
                  >
                    <Icons.ArrowLeft /> Sabhi Services Par Wapas Jayein
                  </button>
                </div>
              ) : (
                <div className="bg-white border border-slate-300 rounded-xl p-4 shadow-2xs">
                  <div className="flex items-center justify-between border-b border-slate-200 pb-2 mb-3">
                    <div className="flex items-center gap-2">
                      <span className="text-blue-700"><Icons.Bell /></span>
                      <h2 className="font-extrabold text-slate-900 text-sm sm:text-base uppercase tracking-wider">
                        Notice Board / Taaza Updates
                      </h2>
                    </div>
                    {isAdmin && (
                      <button
                        onClick={() => openNoticeModal(null)}
                        className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1 rounded transition-colors"
                      >
                        + Add Notice
                      </button>
                    )}
                  </div>

                  <div className="space-y-2">
                    {notices.length > 0 ? (
                      notices.map((n) => (
                        <div key={n.id} className="flex items-start justify-between gap-3 p-2 rounded hover:bg-slate-50 transition-colors border-b border-slate-100 last:border-0">
                          <div className="flex items-start gap-2 text-xs sm:text-sm font-medium text-slate-800">
                            <span className="text-blue-600 font-bold shrink-0 mt-0.5">•</span>
                            <span>{n.text}</span>
                          </div>
                          <div className="flex items-center gap-1.5 shrink-0">
                            {n.date && <span className="text-[11px] text-slate-400 font-normal mr-1">{n.date}</span>}
                            {isAdmin && (
                              <>
                                <button 
                                  onClick={() => openNoticeModal(n)} 
                                  className="text-blue-600 hover:bg-blue-50 p-1 rounded"
                                  title="Edit Notice"
                                >
                                  <Icons.Edit3 />
                                </button>
                                <button 
                                  onClick={() => handleDeleteNotice(n.id)} 
                                  className="text-rose-600 hover:bg-rose-50 p-1 rounded"
                                  title="Delete Notice"
                                >
                                  <Icons.Trash2 />
                                </button>
                              </>
                            )}
                          </div>
                        </div>
                      ))
                    ) : (
                      <p className="text-xs text-slate-400 italic">Abhi koi naya notice nahi hai. Admin Login karke notice add karein.</p>
                    )}
                  </div>
                </div>
              )}

              {/* SEARCH & CATEGORIES TABS */}
              {selectedCat === 'Sabhi Services' && (
                <div className="space-y-3">
                  <div className="relative">
                    <div className="absolute left-3.5 top-3 text-slate-400"><Icons.Search /></div>
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="College Admission, Jati, Scholarship Form search karein..."
                      className="w-full bg-white border border-slate-300 rounded-xl pl-10 pr-4 py-2.5 text-xs sm:text-sm font-medium focus:outline-none focus:border-blue-600 shadow-2xs"
                    />
                  </div>

                  <div className="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none">
                    {categories.map((cat) => (
                      <div key={cat} className="flex items-center shrink-0">
                        <button
                          onClick={() => setSelectedCat(cat)}
                          className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all border ${
                            selectedCat === cat
                              ? 'bg-blue-700 text-white border-blue-700'
                              : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-200'
                          }`}
                        >
                          {cat}
                        </button>
                        {isAdmin && cat !== 'Sabhi Services' && (
                          <button 
                            onClick={() => handleDeleteCategory(cat)}
                            className="ml-1 text-slate-400 hover:text-rose-600 p-1"
                            title="Delete Category"
                          >
                            <Icons.X />
                          </button>
                        )}
                      </div>
                    ))}

                    {isAdmin && (
                      <button
                        onClick={() => setShowCategoryModal(true)}
                        className="bg-slate-800 text-white text-xs font-bold px-3 py-1.5 rounded-lg shrink-0"
                      >
                        + Add Category
                      </button>
                    )}
                  </div>
                </div>
              )}

              {/* Service Cards Grid */}
              <div className="space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="font-extrabold text-slate-900 text-sm sm:text-base">
                    {selectedCat} ({filteredServices.length})
                  </h3>
                  {isAdmin && (
                    <button
                      onClick={() => openServiceModal(null)}
                      className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3.5 py-2 rounded-lg shadow-2xs flex items-center gap-1.5"
                    >
                      <Icons.Plus /> Naya Service Button Add Karein
                    </button>
                  )}
                </div>

                {filteredServices.length === 0 ? (
                  <div className="bg-white p-8 rounded-xl border border-slate-200 text-center">
                    <p className="text-slate-500 font-bold text-sm">Is category me abhi koi service nahi hai! Admin login karke naya form add karein.</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {filteredServices.map((srv) => (
                      <div
                        key={srv.id}
                        onClick={() => openServiceDetail(srv)}
                        className="bg-white rounded-xl border border-slate-300 shadow-2xs hover:shadow-md transition-all cursor-pointer flex flex-col justify-between group overflow-hidden"
                      >
                        <div>
                          {srv.bannerUrl && (
                            <div className="h-28 w-full overflow-hidden bg-slate-100">
                              <img src={srv.bannerUrl} alt={srv.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                            </div>
                          )}

                          <div className="p-4">
                            <div className="flex items-center justify-between mb-2">
                              <span className="bg-slate-100 text-slate-700 text-[10px] font-bold px-2 py-0.5 rounded border border-slate-200">
                                {srv.category}
                              </span>

                              {isAdmin && (
                                <div className="flex items-center gap-1 z-10" onClick={(e) => e.stopPropagation()}>
                                  <button
                                    onClick={(e) => openServiceModal(srv, e)}
                                    className="p-1.5 text-blue-600 hover:bg-blue-50 rounded bg-blue-50/50 border border-blue-200"
                                    title="Edit Service"
                                  >
                                    <Icons.Edit3 />
                                  </button>
                                  <button
                                    onClick={(e) => handleDeleteService(srv.id, e)}
                                    className="p-1.5 text-rose-600 hover:bg-rose-50 rounded bg-rose-50/50 border border-rose-200"
                                    title="Delete Service"
                                  >
                                    <Icons.Trash2 />
                                  </button>
                                </div>
                              )}
                            </div>

                            <h4 className="font-bold text-slate-900 text-sm group-hover:text-blue-700 leading-snug">
                              {srv.title}
                            </h4>

                            {srv.shortDesc && (
                              <p className="text-xs text-slate-500 mt-1.5 line-clamp-2">
                                {srv.shortDesc}
                              </p>
                            )}
                          </div>
                        </div>

                        <div className="p-4 pt-2 border-t border-slate-100 flex items-center justify-between text-xs font-bold text-blue-700">
                          <span>Full Detail & Apply</span>
                          <span className="group-hover:translate-x-1 transition-transform"><Icons.ChevronRight /></span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </main>
          )}

          {/* ADMIN LOGIN MODAL */}
          {showLoginModal && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl max-w-sm w-full p-5 shadow-xl border border-slate-200">
                <div className="flex items-center justify-between mb-3">
                  <h3 className="font-bold text-slate-900 text-base">Firebase Admin Login</h3>
                  <button onClick={() => setShowLoginModal(false)} className="text-slate-400 hover:text-slate-600">
                    <Icons.X />
                  </button>
                </div>
                <form onSubmit={handleAdminEmailLogin} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Admin Email ID:</label>
                    <input
                      type="email"
                      value={adminEmail}
                      onChange={(e) => setAdminEmail(e.target.value)}
                      placeholder="Admin email daalein..."
                      className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-xs font-medium focus:outline-none"
                      required
                      autoFocus
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Password:</label>
                    <input
                      type="password"
                      value={adminPassword}
                      onChange={(e) => setAdminPassword(e.target.value)}
                      placeholder="Password daalein..."
                      className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-xs font-medium focus:outline-none"
                      required
                    />
                  </div>

                  {authError && <p className="text-xs text-rose-600 font-bold mt-1">{authError}</p>}

                  <button
                    type="submit"
                    disabled={isAuthLoading}
                    className="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold text-xs py-2.5 rounded-lg transition-colors flex items-center justify-center gap-1"
                  >
                    {isAuthLoading ? 'Authenticating Firebase...' : 'Login As Admin'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ADD / EDIT SERVICE MODAL */}
          {showServiceFormModal && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-3 overflow-y-auto">
              <div className="bg-white rounded-xl max-w-xl w-full p-5 shadow-2xl my-6 border border-slate-200">
                <div className="flex items-center justify-between mb-4 border-b pb-2">
                  <h3 className="font-bold text-slate-900 text-sm">
                    {editingServiceId ? 'Service Edit Karein (Realtime DB)' : 'Naya Service Add Karein (Realtime DB)'}
                  </h3>
                  <button onClick={() => setShowServiceFormModal(false)} className="text-slate-400">
                    <Icons.X />
                  </button>
                </div>

                <form onSubmit={handleSaveService} className="space-y-3 text-xs font-medium">
                  <div>
                    <label className="block text-slate-700 font-bold mb-1">Category:</label>
                    <select
                      value={formCategory}
                      onChange={(e) => setFormCategory(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-xs font-bold"
                    >
                      {categories.filter(c => c !== 'Sabhi Services').map(c => (
                        <option key={c} value={c}>{c}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-slate-700 font-bold mb-1">Title (Heading):</label>
                    <input
                      type="text"
                      value={formTitle}
                      onChange={(e) => setFormTitle(e.target.value)}
                      placeholder="e.g. Patliputra University Graduation Form"
                      className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-xs"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-slate-700 font-bold mb-1">Banner Image Link / URL (Optional):</label>
                    <input
                      type="url"
                      value={formBannerUrl}
                      onChange={(e) => setFormBannerUrl(e.target.value)}
                      placeholder="https://example.com/banner.jpg"
                      className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-xs"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-700 font-bold mb-1">Chhota Description (Summary):</label>
                    <input
                      type="text"
                      value={formShortDesc}
                      onChange={(e) => setFormShortDesc(e.target.value)}
                      placeholder="Card par dikhne wala ek line ka intro"
                      className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-xs"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-700 font-bold mb-1">Kya-Kya Lagega (Required Docs - 1 Per Line):</label>
                    <textarea
                      rows={3}
                      value={formDocs}
                      onChange={(e) => setFormDocs(e.target.value)}
                      placeholder="10th Marksheet&#10;Aadhaar Card&#10;Photo"
                      className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-xs font-mono"
                    />
                  </div>

                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <label className="text-slate-700 font-bold">Poora Description:</label>
                      <div className="flex gap-1 bg-slate-100 p-0.5 rounded border border-slate-200">
                        <button
                          type="button"
                          onClick={() => setFormDescType('normal')}
                          className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                            formDescType === 'normal' ? 'bg-white text-blue-700 shadow-2xs' : 'text-slate-500'
                          }`}
                        >
                          Normal Text
                        </button>
                        <button
                          type="button"
                          onClick={() => setFormDescType('html')}
                          className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                            formDescType === 'html' ? 'bg-white text-blue-700 shadow-2xs' : 'text-slate-500'
                          }`}
                        >
                          HTML Code
                        </button>
                      </div>
                    </div>
                    <textarea
                      rows={4}
                      value={formDescription}
                      onChange={(e) => setFormDescription(e.target.value)}
                      placeholder={formDescType === 'html' ? "<h1>Code</h1>" : "Details text likhein..."}
                      className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-xs font-mono"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-700 font-bold mb-1">Apply Link (Google Form URL):</label>
                    <input
                      type="url"
                      value={formApplyLink}
                      onChange={(e) => setFormApplyLink(e.target.value)}
                      placeholder="https://docs.google.com/forms/..."
                      className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-xs"
                      required
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2 border-t">
                    <button
                      type="button"
                      onClick={() => setShowServiceFormModal(false)}
                      className="px-3 py-1.5 bg-slate-200 font-bold rounded-lg"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-1.5 bg-blue-700 hover:bg-blue-800 text-white font-bold rounded-lg shadow-sm"
                    >
                      Save To Realtime DB
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADD / EDIT NOTICE MODAL */}
          {showNoticeModal && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-3">
              <div className="bg-white rounded-xl max-w-sm w-full p-5 shadow-xl border border-slate-200">
                <h3 className="font-bold text-slate-900 text-sm mb-3">
                  {editingNoticeId ? 'Notice Board Edit Karein' : 'Notice Board Me Naya Notice Add Karein'}
                </h3>
                <form onSubmit={handleSaveNotice} className="space-y-3 text-xs">
                  <input
                    type="text"
                    value={noticeText}
                    onChange={(e) => setNoticeText(e.target.value)}
                    placeholder="Notice text likhein..."
                    className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2"
                    required
                  />
                  <div className="flex justify-end gap-2">
                    <button type="button" onClick={() => setShowNoticeModal(false)} className="px-3 py-1.5 bg-slate-200 font-bold rounded-lg">
                      Cancel
                    </button>
                    <button type="submit" className="px-3 py-1.5 bg-blue-700 text-white font-bold rounded-lg">
                      Save Notice
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADD CATEGORY MODAL */}
          {showCategoryModal && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-3">
              <div className="bg-white rounded-xl max-w-sm w-full p-5 shadow-xl border border-slate-200">
                <h3 className="font-bold text-slate-900 text-sm mb-3">Nayi Sub-Category Add Karein</h3>
                <form onSubmit={handleAddCategory} className="space-y-3 text-xs">
                  <input
                    type="text"
                    value={newCatName}
                    onChange={(e) => setNewCatName(e.target.value)}
                    placeholder="e.g. Government Schemes"
                    className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2"
                    required
                  />
                  <div className="flex justify-end gap-2">
                    <button type="button" onClick={() => setShowCategoryModal(false)} className="px-3 py-1.5 bg-slate-200 font-bold rounded-lg">
                      Cancel
                    </button>
                    <button type="submit" className="px-3 py-1.5 bg-blue-700 text-white font-bold rounded-lg">
                      Add Category
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-slate-900 text-slate-400 text-xs py-6 mt-12 border-t border-slate-800">
            <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
              <div>
                <p className="font-bold text-white">SGS ONLINE SERVICE © 2026</p>
                <p className="text-slate-500 text-[11px] mt-0.5">All Governmental & College Online Works Portal</p>
              </div>

              <div className="flex items-center gap-4 text-xs">
                <button
                  onClick={() => setActiveModalPage('privacy')}
                  className="text-slate-400 hover:text-white underline underline-offset-2"
                >
                  Privacy Policy
                </button>

                <button
                  onClick={() => setActiveModalPage('terms')}
                  className="text-slate-400 hover:text-white underline underline-offset-2"
                >
                  Terms & Conditions
                </button>

                {isAdmin ? (
                  <button
                    onClick={handleAdminLogout}
                    className="text-emerald-400 hover:text-emerald-300 text-xs font-semibold underline underline-offset-2 transition-colors cursor-pointer"
                  >
                    ✓ Admin Active (Logout)
                  </button>
                ) : (
                  <button
                    onClick={() => setShowLoginModal(true)}
                    className="text-slate-500 hover:text-slate-300 text-xs font-medium underline underline-offset-2 transition-colors cursor-pointer"
                  >
                    Admin Login
                  </button>
                )}
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
